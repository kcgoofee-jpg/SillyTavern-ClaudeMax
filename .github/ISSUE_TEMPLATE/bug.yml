name: 问题反馈
description: 连不上、回复出错、缓存不中、面板显示不对
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **请不要贴聊天内容、API key、访问密码或 Claude 登录信息。** 截图前遮住聊天正文。
  - type: input
    id: version
    attributes:
      label: 扩展版本
      description: 面板「更多 → 调试选项 → 连接」里显示的代理版本，或 manifest.json 里的 version
      placeholder: 2.23.1
    validations:
      required: true
  - type: dropdown
    id: frontend
    attributes:
      label: 前端
      options: [SillyTavern（电脑）, SillyTavern（手机浏览器连电脑）, TauriTavern（手机）, TauriTavern（电脑）, 其他]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 模型
      placeholder: Opus 5.5 / Opus 4.6 1M / Sonnet 5 …
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 做了什么、期望什么、实际怎样
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 代理日志（可选）
      description: 代理终端里出错前后几行（以 [claude-subscription] 开头的），只含耗时和 token 数，不含聊天内容
      render: text
